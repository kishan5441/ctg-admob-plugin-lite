name: Build AdMob Plugin

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'          # Godot 4.x ke liye JDK 17 mandatory hai

    - name: Setup Gradle 8.11.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.11.1      # ✅ Godot 4.7.2 ke liye official version

    - name: Generate Gradle Wrapper (8.11.1)
      run: |
        cd plugin
        gradle wrapper --gradle-version 8.11.1   # ✅ Wrapper bhi 8.11.1 par lock

    - name: Grant execute permission
      run: chmod +x plugin/gradlew

    - name: Build AAR
      run: |
        cd plugin
        ./gradlew build

    - name: Upload AAR
      uses: actions/upload-artifact@v4
      with:
        name: admob-plugin-aar
        path: plugin/build/outputs/aar/*.aar
