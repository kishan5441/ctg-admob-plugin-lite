name: Build AdMob Plugin

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build AAR
      run: |
        cd plugin
        chmod +x gradlew
        ./gradlew build

    - name: Upload AAR
      uses: actions/upload-artifact@v4
      with:
        name: admob-plugin-aar
        path: plugin/build/outputs/aar/*.aar
