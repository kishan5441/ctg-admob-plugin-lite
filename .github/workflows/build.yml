name: Build AdMob Plugin

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle (Install Gradle)
      uses: gradle/gradle-build-action@v3  # Yeh line add karein

    - name: Generate Gradle Wrapper
      run: |
        cd plugin
        gradle wrapper --gradle-version 8.5  # Yeh command missing file bana degi[reference:1]

    - name: Grant execute permission for gradlew
      run: chmod +x plugin/gradlew  # Ab yeh file mil jayegi

    - name: Build AAR
      run: |
        cd plugin
        ./gradlew build

    - name: Upload AAR
      uses: actions/upload-artifact@v4
      with:
        name: admob-plugin-aar
        path: plugin/build/outputs/aar/*.aar
