name: Build AdMob Plugin

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.11.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.11.1

    - name: Generate Gradle Wrapper (root se)
      run: gradle wrapper --gradle-version 8.11.1

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Build AAR (root se, plugin module build hoga)
      run: ./gradlew :plugin:build

    - name: Upload AAR
      uses: actions/upload-artifact@v4
      with:
        name: admob-plugin-aar
        path: plugin/build/outputs/aar/*.aar
